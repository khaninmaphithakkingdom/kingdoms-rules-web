          2a1239bdeda32712370511d71cf829b29b76ef1358107f98e9a5259593708889 16659 Troodon/Troodon.json
          422d842a36965bbff1a00261d36dcc4af467aab8a7b0908e89ee538f1f2decff 13709596 Tyrannosaurus/Tyrannosaurus.glb
          a44f3405773594689145361e5a7843736f66b4f363d10a40a244251600a63ff0 19285 Tyrannosaurus/Tyrannosaurus.json
          EOF
          while read -r expected_sha expected_bytes rel; do
            dest="assets/viewer/$rel"
            mkdir -p "$(dirname "$dest")"
            echo "Downloading $rel"
            curl --fail --location --retry 5 --retry-delay 2 --connect-timeout 20 --max-time 300 "$ASSET_BASE/$rel" -o "$dest"
            actual_bytes="$(stat -c%s "$dest")"
            test "$actual_bytes" = "$expected_bytes"
            echo "$expected_sha  $dest" | sha256sum -c -
          done < /tmp/viewer-assets.txt
          test "$(find assets/viewer -type f \( -name "*.glb" -o -name "*.json" \) | wc -l)" -eq 44

      - name: Commit verified Viewer assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/viewer
          git commit -m "Viewer: add verified released species assets"
          git push origin HEAD:main
