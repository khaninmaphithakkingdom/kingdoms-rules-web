name: Import Viewer Assets

on:
  push:
    paths:
      - ".github/workflows/import-viewer-assets.yml"

permissions:
  contents: write

concurrency:
  group: viewer-asset-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Download and verify released Viewer assets
        shell: bash
        env:
          ASSET_BASE: 'https://consolidated-sierra-win-historic.trycloudflare.com'
        run: |
          set -euo pipefail
          mkdir -p assets/viewer
          cat > /tmp/viewer-assets.txt <<'EOF'
          0ef9ec2f520ab45825f84c6d39c2c0e22b3891af225ce23357b3a2d8e872471e 13479992 Allosaurus/Allosaurus.glb
