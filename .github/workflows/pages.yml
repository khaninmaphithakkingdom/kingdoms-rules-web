name: Validate Kingdoms Rules

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rules-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Rebuild final logo asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          cat logo-v13-data/logo-*.txt | tr -d '\r\n' | base64 -d > assets/kingdoms-isle-logo-v13.jpg
          test -s assets/kingdoms-isle-logo-v13.jpg
          file assets/kingdoms-isle-logo-v13.jpg

      - name: Persist final logo asset
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/kingdoms-isle-logo-v13.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Persist final Kingdoms Isle logo"
            git push origin HEAD:main
          fi

      - name: Validate v13 site
        shell: bash
        run: |
          set -euo pipefail
          node --check data/rules-v12.js
          node --check js/app-v20.js
          test -s css/style-v20.css
          test -s assets/herd-tokens-v10.jpg
          test -s assets/staff-assistance-area-v10.jpg
          test -s assets/kingdoms-isle-logo-v13.jpg
