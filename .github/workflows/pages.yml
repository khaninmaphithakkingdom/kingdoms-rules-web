name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Rebuild Herd Tokens image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          cat herd64/herd64-*.txt | tr -d '\r\n' | base64 -d > assets/herd-tokens.jpg
          test -s assets/herd-tokens.jpg
          file assets/herd-tokens.jpg

      - name: Persist rebuilt image
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/herd-tokens.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Restore Herd Tokens image [skip ci]"
            git push origin HEAD:main
          fi

      - name: Validate JavaScript
        run: |
          node --check data/rules.js
          node --check js/app.js

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
