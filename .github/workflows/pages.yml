name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Rebuild final image assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          cat asset-v10-final/herd-*.b64 | tr -d '\r\n' | base64 -d > assets/herd-tokens-v10.jpg
          cat asset-v10-final/staff-*.b64 | tr -d '\r\n' | base64 -d > assets/staff-assistance-area-v10.jpg
          test -s assets/herd-tokens-v10.jpg
          test -s assets/staff-assistance-area-v10.jpg

      - name: Validate JavaScript
        run: |
          node --check data/rules.js
          node --check data/rules-v10.js
          node --check js/app.js
          node --check js/app-v10.js

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
